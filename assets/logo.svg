<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 160" role="img" aria-labelledby="title desc">
  <title id="title">Mahli Digital</title>
  <desc id="desc">Egybefolyó MD monogram és Mahli Digital felirat</desc>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#43e7ff"/>
      <stop offset="0.52" stop-color="#1e9cff"/>
      <stop offset="1" stop-color="#765fff"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- One continuous MD mark: the right stem of the M is also the left stem of the D -->
  <path d="M28 124V34L76 92L124 34V124M124 34H174C222 34 250 52 250 79C250 106 222 124 174 124H124" fill="none" stroke="url(#g)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  <text x="290" y="79" fill="#f6fbff" font-family="Arial,Helvetica,sans-serif" font-size="48" font-weight="800" letter-spacing="3">MAHLI</text>
  <text x="293" y="121" fill="#39cfff" font-family="Arial,Helvetica,sans-serif" font-size="31" font-weight="800" letter-spacing="10">DIGITAL</text>
</svg>
